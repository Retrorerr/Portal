icon: assets/portal-icon.png
android:
  assets:
    - assets/setup-progress-v2.html
    - assets/runtime-error.html
    - assets/unsupported.html
    - assets/ld-linux-aarch64.so.1
    - assets/wireplumber-share.tar
  runtime_libs:
    - assets/libs
  gradle: true
  # SPIKE-ONLY (branch compose-setup-spike): Jetpack Compose overlay
  # dependencies. Versions are pinned explicitly (matching BOM 2024.12.01,
  # plus its transitive alignments) instead of importing the BOM so xbuild
  # needs no Gradle DSL special cases.
  dependencies:
    - "androidx.compose.ui:ui:1.7.6"
    - "androidx.compose.runtime:runtime:1.7.6"
    - "androidx.compose.foundation:foundation:1.7.6"
    - "androidx.compose.material3:material3:1.3.1"
    - "androidx.compose.animation:animation:1.7.6"
    - "androidx.compose.material:material-icons-core:1.7.6"
    - "androidx.compose.material:material-ripple:1.7.6"
    - "androidx.lifecycle:lifecycle-runtime:2.8.7"
    - "androidx.lifecycle:lifecycle-viewmodel:2.8.7"
    - "androidx.savedstate:savedstate:1.2.1"
    - "androidx.core:core:1.13.1"
    - "androidx.core:core-splashscreen:1.0.1"
  manifest:
    package: app.polarbear.portal
    sdk:
      min_sdk_version: 21
      target_sdk_version: 35
    application:
      label: "Portal"
      extract_native_libs: true # Required for proot invocations
      use_cleartext_traffic: true # Required for the loopback setup-progress WebSocket.
      theme: "@style/PortalSplashTheme"
      activities:
        - name: app.polarbear.PortalActivity
      services:
        - name: app.polarbear.KeyboardAccessibilityService
          permission: android.permission.BIND_ACCESSIBILITY_SERVICE
          label: "@string/keyboard_service_label"
          enabled: true
          exported: false
          intent_filters:
            - actions:
                - android.accessibilityservice.AccessibilityService
          meta_data:
            - name: android.accessibilityservice
              resource: "@xml/keyboard_accessibility_service"
      meta_data:
        - name: com.samsung.android.dex.launchwidth
          value: 0
        - name: com.samsung.android.dex.launchheight
          value: 0
        - name: com.samsung.android.sdk.multiwindow.dex.launchwidth
          value: 0
        - name: com.samsung.android.sdk.multiwindow.dex.launchheight
          value: 0
    uses_permission:
      - name: android.permission.INTERNET
      - name: android.permission.ACCESS_NETWORK_STATE
      - name: android.permission.POST_NOTIFICATIONS
      - name: android.permission.MANAGE_EXTERNAL_STORAGE
      - name: android.permission.READ_EXTERNAL_STORAGE
      - name: android.permission.WRITE_EXTERNAL_STORAGE
        max_sdk_version: 28
    uses_feature:
      - name: android.hardware.type.pc
        required: false
