name: Build APK & AAB

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
    branches:
      - main
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Signing secrets are passed only to the steps that sign (keystore setup and
# the Gradle builds), never to the whole workflow or to third-party actions.
env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release-label:
    name: Validate Release Label
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.classify.outputs.should_build }}

    steps:
      - name: Classify PR
        id: classify
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("should_build", "true");
              return;
            }

            const pr = context.payload.pull_request;
            const appReleaseLabels = new Set([
              "release:breaking",
              "release:feature",
              "release:bugfix",
              "release:patch",
              "release:improvement",
              "release:optimisation",
            ]);
            const releaseLabels = new Set([...appReleaseLabels, "release:docs"]);
            const labels = pr.labels.map((label) => label.name);
            const selected = labels.filter((label) => releaseLabels.has(label));
            const sameRepo = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (selected.length !== 1) {
              core.setFailed(
                `PRs to main must have exactly one release label. Found: ${
                  selected.join(", ") || "none"
                }`
              );
              return;
            }

            const shouldBuild =
              sameRepo &&
              appReleaseLabels.has(selected[0]);

            core.info(`same-repo PR: ${sameRepo}`);
            core.info(`release label: ${selected[0]}`);
            core.info(`build signed APK: ${shouldBuild}`);
            core.setOutput("should_build", shouldBuild ? "true" : "false");

  build:
    needs: validate-release-label
    if: github.event_name != 'pull_request' || needs.validate-release-label.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create GitHub Release (tag builds)

    steps:
      - uses: actions/checkout@v5

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Extract version
        id: extract_version
        run: echo "version=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      - name: Verify pinned production runtime is publicly available
        run: python3 scripts/verify_runtime_release.py

      - name: Extract release notes
        if: github.ref_type == 'tag'
        id: release_notes
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const tag = process.env.GITHUB_REF_NAME || context.ref.replace(/^refs\/tags\//, "");
            let notes = "";

            try {
              const ref = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });

              if (ref.data.object.type === "tag") {
                const tagObject = await github.rest.git.getTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_sha: ref.data.object.sha,
                });
                notes = (tagObject.data.message || "").trim();
              }
            } catch (error) {
              core.warning(`Could not load release notes from tag ${tag}: ${error.message}`);
            }

            const notesPath = path.join(process.env.RUNNER_TEMP, "release-notes.md");
            fs.writeFileSync(notesPath, notes ? `${notes}\n` : "", "utf8");
            core.setOutput("found", notes ? "true" : "false");
            core.setOutput("path", notesPath);

      - name: Fallback release notes to commit message
        if: github.ref_type == 'tag' && steps.release_notes.outputs.found != 'true'
        run: |
          git log -1 --pretty=%B > "${{ steps.release_notes.outputs.path }}"

      - name: Setup signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p target/x/release/android/gradle/app
          printf '%s\n' "$ANDROID_KEYSTORE_BASE64" | base64 -d > target/x/release/android/gradle/app/release-key.jks
          # Verify keystore
          keytool -list -v -keystore target/x/release/android/gradle/app/release-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD"

      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: Build xbuild
        working-directory: patches/xbuild
        run: cargo install --path xbuild

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: x build --release --platform=android --arch=arm64 --format=apk

      - name: Rename APK
        run: |
          mv target/x/release/android/gradle/app/build/outputs/apk/release/app-release.apk target/x/Portal-${{ steps.extract_version.outputs.version }}.apk
          # Fixed name so releases/latest/download/Portal.apk always points at the newest build
          cp target/x/Portal-${{ steps.extract_version.outputs.version }}.apk target/x/Portal.apk

      - name: Prepare PR APK artifact
        id: pr_apk_artifact
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          SAFE_REF=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' | cut -c1-60)
          if [ -z "$SAFE_REF" ]; then
            SAFE_REF="pr-${PR_NUMBER}"
          fi
          SHORT_SHA="${HEAD_SHA:0:7}"
          ARTIFACT_FILE="Portal-${VERSION}-${SAFE_REF}-${SHORT_SHA}-release.apk"
          ARTIFACT_PATH="target/x/${ARTIFACT_FILE}"
          cp "target/x/Portal-${VERSION}.apk" "$ARTIFACT_PATH"
          echo "path=${ARTIFACT_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload PR release APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pr_apk_artifact.outputs.path }}
          if-no-files-found: error
          archive: false

      - name: Build AAB
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: x build --release --platform=android --arch=arm64 --format=aab

      - name: Rename AAB
        if: github.event_name != 'pull_request'
        run: |
          mv target/x/release/android/gradle/app/build/outputs/bundle/release/app-release.aab target/x/Portal-${{ steps.extract_version.outputs.version }}.aab

      # Portal Debug is a separate app (app.polarbear, "Portal Debug", blue-dot
      # icon, portal-debug feature), built from manifest.debug.yaml like
      # scripts/build_android_variants.ps1 does. Gradle signs debug builds with
      # ~/.android/debug.keystore; this is the maintainer's, so GitHub and local
      # Debug builds update each other.
      - name: Setup debug keystore
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          printf '%s\n' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Build Portal Debug APK
        if: github.event_name != 'pull_request'
        run: |
          cp manifest.debug.yaml manifest.yaml
          x build --debug --features portal-debug --platform=android --arch=arm64 --format=apk
          git checkout -- manifest.yaml

      - name: Verify and rename Portal Debug APK
        if: github.event_name != 'pull_request'
        run: |
          apk=target/x/debug/android/gradle/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "build-tools: $tools"
          badging=$("$tools/aapt" dump badging "$apk")
          grep -E "^(package|application-label|application-debuggable)" <<<"$badging"
          fail() { echo "::error::Portal Debug APK $1"; exit 1; }
          grep -q "^package: name='app.polarbear' " <<<"$badging" || fail "has the wrong package"
          grep -q "^application-label:'Portal Debug'$" <<<"$badging" || fail "has the wrong label"
          grep -q "^application-debuggable$" <<<"$badging" || fail "is not debuggable"
          # Sign with the maintainer's debug key explicitly instead of
          # trusting where Gradle looks for its default debug keystore.
          out=target/x/Portal-${{ steps.extract_version.outputs.version }}-debug.apk
          "$tools/apksigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android --out "$out" "$apk"
          certs=$("$tools/apksigner" verify --print-certs "$out")
          echo "$certs"
          grep -q "certificate SHA-256 digest: a512a376e17078bc9f8f4167457bc6c7be221a59d2e159c6d5750750266d748a" <<<"$certs" \
            || fail "is not signed with the maintainer's debug key"

      - name: Upload Portal Debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: target/x/Portal-${{ steps.extract_version.outputs.version }}-debug.apk
          if-no-files-found: error
          archive: false

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          name: Portal v${{ steps.extract_version.outputs.version }}
          tag_name: v${{ steps.extract_version.outputs.version }}
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            target/x/Portal-${{ steps.extract_version.outputs.version }}.apk
            target/x/Portal.apk
            target/x/Portal-${{ steps.extract_version.outputs.version }}-debug.apk
            target/x/Portal-${{ steps.extract_version.outputs.version }}.aab
