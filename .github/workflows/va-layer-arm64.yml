# Portal's VA layer (the termuxva hardware video decode driver), built from
# source on ARM64.
#
# Builds the driver src/android/backend/video_decode.rs downloads with
# patches/mesa/va-layer-r1/build.sh inside a digest-pinned Debian 13
# (trixie) container on a native ARM64 runner: lfdevs' r1 tag plus Portal's
# patch. Uploads the driver, its gzip release asset and SHA256SUMS.
#
# permissions: contents:read. No secrets, releases or pushes.

name: VA layer ARM64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - patches/mesa/va-layer-r1/**
      - .github/workflows/va-layer-arm64.yml
  push:
    branches:
      - main
      - feat/hardware-video-acceleration
    paths:
      - patches/mesa/va-layer-r1/**
      - .github/workflows/va-layer-arm64.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VA layer (ARM64 trixie)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      # Same digest-pinned trixie image as the Mesa KGSL layer workflow.
      image: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get build-dep -y mesa
          apt-get install -y --no-install-recommends ca-certificates git libva-dev binutils

      - uses: actions/checkout@v5
        with:
          path: portal

      - name: Build
        run: SRC="$PWD/mesa" OUT="$PWD/out" bash portal/patches/mesa/va-layer-r1/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: va-layer-r1
          path: out/
          if-no-files-found: error
