name: Bug report
description: Report a reproducible Portal problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Portal. Please separate physical-device results from emulator observations.
  - type: input
    id: build
    attributes:
      label: Portal build
      description: Release version or full commit SHA.
      placeholder: v2.2.0 or 0123456789abcdef...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: OnePlus Pad 3, Android 16
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Physical ARM64 device
        - Android emulator
        - Host-only test or build
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation history
      options:
        - Fresh install
        - Upgraded in place
        - Existing guest after APK replacement
        - Unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the shortest sequence that reliably triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Paste a short log excerpt or attach a reviewed Portal diagnostics archive. Do not include credentials or unrelated personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I have identified whether this result came from physical ARM64 hardware or an emulator.
          required: true
