name: Bug report
description: Report a reproducible Portal problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Portal. Please separate physical-device results from emulator observations.
  - type: textarea
    id: device-info
    attributes:
      label: Portal and device details
      description: Filled in for you when you use **Report** in the app. Otherwise give your Portal version, where you got it, device model and Android version.
      render: text
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Physical ARM64 device
        - Android emulator
        - Host-only test or build
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation history
      options:
        - Fresh install
        - Upgraded in place
        - Existing guest after APK replacement
        - Unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the shortest sequence that reliably triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Paste a short log excerpt or attach a reviewed Portal diagnostics archive. Do not include credentials or unrelated personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I have identified whether this result came from physical ARM64 hardware or an emulator.
          required: true
