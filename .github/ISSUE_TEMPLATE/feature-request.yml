name: Feature request
description: Propose a focused improvement to Portal
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should Portal improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe the observable result rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Compatibility and recovery
      description: Note effects on existing guests, Android versions, signing, storage, or the native-Wayland path.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
