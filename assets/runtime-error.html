<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Desktop could not start</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10131a; color: #f3f5f7; }
      main { box-sizing: border-box; width: min(680px, 92vw); padding: 28px; border: 1px solid #303744; border-radius: 18px; background: #181d26; box-shadow: 0 16px 48px #0008; }
      h1 { margin: 0 0 10px; font-size: 1.45rem; }
      p { line-height: 1.5; color: #c9d1dc; }
      .reason { margin: 18px 0; padding: 12px; border-radius: 10px; background: #271f25; color: #ffb7b7; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .88rem; }
      button { border: 0; border-radius: 10px; padding: 12px 16px; margin: 6px 8px 0 0; color: #07120b; background: #78e08f; font-weight: 700; font-size: 1rem; }
      button.secondary { background: #303b4c; color: #f3f5f7; }
      #result { min-height: 1.4em; color: #a9e8ba; }
    </style>
  </head>
  <body>
    <main>
      <h1>Local Desktop needs recovery</h1>
      <p>Plasma did not produce a frame in time. Your Linux files are still safe. Open the graphical recovery session to retry Plasma, or export a diagnostic archive for support.</p>
      <div class="reason" id="reason">The Android host reported an unknown startup failure.</div>
      <button id="export">Export diagnostics</button>
      <button class="secondary" id="retry">Retry Plasma</button>
      <p id="result" role="status"></p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const reason = params.get("reason");
      if (reason) document.getElementById("reason").textContent = reason;
      const port = params.get("port");
      const token = params.get("token");
      let socket;
      function connect() {
        if (!port) return;
        socket = new WebSocket(`ws://127.0.0.1:${port}`, "rust-websocket");
        socket.onopen = () => send("hello");
        socket.onmessage = event => {
          try {
            const data = JSON.parse(event.data);
            if (data.message) document.getElementById("result").textContent = data.message;
          } catch (_) {}
        };
      }
      function send(action) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ action, token }));
        }
      }
      document.getElementById("export").onclick = () => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          send("export_diagnostics");
          document.getElementById("result").textContent = "Preparing diagnostics…";
        } else {
          document.getElementById("result").textContent = "Diagnostics server is not ready; reopen Local Desktop and try again.";
        }
      };
      document.getElementById("retry").onclick = () => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          send("retry_plasma");
          document.getElementById("result").textContent = "Retry requested…";
        } else {
          document.getElementById("result").textContent = "Retry is available from the graphical recovery session.";
        }
      };
      connect();
    </script>
  </body>
</html>
