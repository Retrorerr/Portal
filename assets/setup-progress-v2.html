<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal setup</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10131a; color: #f3f5f7; }
      main { box-sizing: border-box; width: min(760px, 92vw); padding: 28px; border: 1px solid #303744; border-radius: 18px; background: #181d26; box-shadow: 0 16px 48px #0008; }
      h1 { margin: 0 0 8px; font-size: 1.5rem; }
      p { color: #c9d1dc; line-height: 1.45; }
      progress { width: 100%; height: 12px; accent-color: #78e08f; }
      .status { margin: 16px 0; min-height: 1.5em; }
      .error { padding: 12px; border-radius: 10px; background: #3a2028; color: #ffb7b7; }
      .logs { max-height: 220px; overflow: auto; padding: 12px; border-radius: 10px; background: #0d1015; color: #aeb8c5; font: .8rem ui-monospace, monospace; white-space: pre-wrap; }
      button { border: 0; border-radius: 10px; padding: 11px 15px; margin: 14px 8px 0 0; color: #07120b; background: #78e08f; font-weight: 700; font-size: .98rem; }
      button.secondary { background: #303b4c; color: #f3f5f7; }
      #handoff { color: #a9e8ba; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening Portal</h1>
      <p>Portal is preparing Debian 13 and Plasma. Keep Portal open. Download and extraction time depends on your connection and storage.</p>
      <progress id="progress"></progress>
      <div class="status" id="status" role="status">Connecting to the installer…</div>
      <div class="error" id="error" hidden></div>
      <div class="logs" id="logs" aria-label="Setup log"></div>
      <button id="export">Export diagnostics</button>
      <button class="secondary" id="retry" hidden>Retry setup</button>
      <div id="handoff" hidden>Setup complete. Waiting for the first presented Plasma frame…</div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const port = params.get("port");
      const token = params.get("token");
      const progress = document.getElementById("progress");
      const status = document.getElementById("status");
      const error = document.getElementById("error");
      const logs = document.getElementById("logs");
      const exportButton = document.getElementById("export");
      const retryButton = document.getElementById("retry");
      const handoff = document.getElementById("handoff");
      let socket;
      function append(message) {
        const line = `[${new Date().toLocaleTimeString()}] ${message}`;
        logs.textContent = `${line}\n${logs.textContent}`.slice(0, 16000);
      }
      function send(action) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ action, token }));
        }
      }
      function handle(data) {
        // Stage count is not a measure of bytes downloaded or extracted.
        if (data.progress === 100) { progress.max = 100; progress.value = 100; }
        if (data.message) { status.textContent = data.message; append(data.message); }
        if (data.isError) { error.hidden = false; error.textContent = data.message || "Setup failed."; retryButton.hidden = false; }
        if (data.exported) status.textContent = data.message || "Diagnostics exported.";
        if (data.ready || data.handoff) { handoff.hidden = false; status.textContent = "Starting Plasma…"; exportButton.disabled = false; }
      }
      if (port) {
        socket = new WebSocket(`ws://127.0.0.1:${port}`, "rust-websocket");
        socket.onmessage = event => { try { handle(JSON.parse(event.data)); } catch (_) {} };
        socket.onopen = () => { append("Connected to installer"); send("hello"); };
        socket.onerror = () => { error.hidden = false; error.textContent = "The installer connection was lost. Reopen Portal to retry."; retryButton.hidden = false; };
        socket.onclose = () => append("Installer connection closed");
      }
      exportButton.onclick = () => { append("Preparing diagnostics archive…"); send("export_diagnostics"); };
      retryButton.onclick = () => { error.hidden = true; retryButton.hidden = true; send("retry_setup"); };
    </script>
  </body>
</html>
