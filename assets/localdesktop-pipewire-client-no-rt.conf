# Installed by Portal into /etc/pipewire/client.conf.d/ (and client-rt.conf.d/).
#
# Guest PipeWire clients (KPipeWire in plasmashell, KWin screencast, Firefox)
# must not negotiate realtime scheduling. Android grants the guest no realtime
# priority (RLIMIT_RTPRIO is 0) and there is no RTKit, yet the desktop portal's
# Realtime interface is reachable on the session bus. PipeWire's module-rt then
# reads RTTimeUSecMax=0 from that RTKit-less portal and clamps the client's
# RLIMIT_RTTIME to 0/0, after which the kernel SIGKILLs the whole client (e.g.
# plasmashell) the first time any of its threads is scheduled realtime.
#
# Without D-Bus support module-rt cannot use the portal/RTKit path and fails
# its (nofail) load before touching rlimits. Disabling only the portal and
# RTKit instead makes PipeWire 1.4 call D-Bus with a NULL object path, which
# aborts KWin.
context.properties = {
    support.dbus = false
}
