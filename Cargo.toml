[package]
name = "localdesktop"
version = "2.3.1"
edition = "2021"
build = "build.rs"
default-run = "build_apk"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["lib", "cdylib"]

# The standalone PipeWire client that owns the Android AAudio output stream. Off
# by default: it links libpipewire-0.3, so it needs an Android PipeWire sysroot
# that the normal APK build does not. See scripts/build-pipewire-aaudio-sink.sh.
[[bin]]
name = "localdesktop_pipewire_aaudio_sink"
path = "src/bin/localdesktop_pipewire_aaudio_sink.rs"
required-features = ["pipewire-sink"]

[features]
pipewire-sink = ["dep:pipewire"]
portal-debug = []

[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = 3     # Daily-driver build: optimize the render/input hot paths.
lto = true
codegen-units = 1

[target.'cfg(target_os = "android")'.dependencies] # Portal's Android host dependencies
tracing = { version = "0.1.41", features = ["release_max_level_warn"] }
jni = "0.21.1"
android_logger = { version = "0.14", default-features = false }
winit = { version = "0.30.11", features = [
    "android-game-activity",
    "wayland",
] }
wayland-protocols = "0.32.6"
wayland-protocols-plasma = { version = "0.3.8", features = ["server"] }
wayland-scanner = "0.31"
khronos-egl = { version = "6.0.0", features = ["dynamic"] }

libloading = "0.8.6"
libc = "0.2"
pathdiff = "0.2"
# ARMv8 SHA-2 instructions: without "asm" sha2 0.10 hashes in software, ~40 s
# per pass over the 920 MiB runtime archive instead of under a second.
sha2 = { version = "0.10.6", features = ["oid", "asm"] }
pipewire = { version = "0.10", features = ["v1_0_0"], optional = true }
smithay = { version = "0.5.0", default-features = false, features = [
    "wayland-protocols",
    "wayland-server",
    "renderer_glow",
    "wayland_frontend",
] }

[target.'cfg(target_os = "linux")'.dependencies] # Host builds: renameat2 in core::install_plan
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies] # Deps used only for setting up cross testing
typst-as-lib = { version = "0.15", features = ["typst-kit-embed-fonts"] }
typst-pdf = "0.14"
pulldown-cmark = { version = "0.12", default-features = false }
regex = "1"

[dependencies] # Deps used for both target
anyhow = "1.0.68"
android-sdkmanager-rs = "0.5.0"
byteorder = "1.4.3"
flate2 = "1.0"
image = { version = "0.24.5", default-features = false, features = [
    "png",
    "webp",
] }
log = { version = "0.4", features = ["release_max_level_warn"] }
pem = "1.1.0"
quick-xml = { version = "0.26.0", features = ["serialize"] }
rasn = "0.6.1"
rasn-pkix = "0.6.0"
reqwest = { version = "0.12.20", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
roxmltree = "0.16.0"
rsa = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.16"
sha2 = { version = "0.10.6", features = ["oid"] }
tar = "0.4.43"
tempfile = "3.20.0"
toml = "0.8.12"
xz2 = { version = "0.1.7", features = ["static"] }
zip = { version = "0.6.3", default-features = false, features = ["deflate"] }
# Runtime images from debian13-arm64-2026.10.08 on are zstd: it decodes an
# order of magnitude faster than xz on phone cores. xz stays for older images.
zstd = { version = "0.13", default-features = false }

[build-dependencies]
cc = "1.2"

[patch.crates-io]
smithay = { path = "patches/smithay" }
winit = { path = "patches/winit" }
# SPIKE-ONLY (spike/game-activity-host): vendored android-activity 0.6.1
# with the GameActivity motion-axis representation extended 48 -> 53 so the
# API 34 touchpad gesture axes 50/51 arrive. Version/API otherwise identical.
android-activity = { path = "patches/android-activity" }
